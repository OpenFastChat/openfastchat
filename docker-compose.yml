services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OFC_DATABASE_URL: postgres://openfastchat:openfastchat@db:5432/openfastchat?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      OFC_DATA_DIR: /data
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    # Lets the app reach a provider on the host, e.g. Ollama on :11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ofc_data:/data
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openfastchat
      POSTGRES_PASSWORD: openfastchat
      POSTGRES_DB: openfastchat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ofc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfastchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ofc_data:
  ofc_pgdata:
